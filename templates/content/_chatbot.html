{% load static %}
<!-- Hotel Assistant Chatbot (Compact & Clean Luxury Design) -->
<div x-data="chatbot" @keydown.escape.window="closeChat" class="relative">

  <!-- Floating Launcher Button: White transparent glassmorphic style -->
  <button
    id="chatLauncherBtn"
    type="button"
    @click="toggleChat"
    class="fixed bottom-24 right-6 z-50 w-13 h-13 sm:w-14 sm:h-14 bg-white/85 hover:bg-white text-teal-950 border border-teal-900/15 shadow-xl backdrop-blur-md rounded-full flex items-center justify-center hover:scale-105 transition-all focus:outline-none focus:ring-4 focus:ring-teal-700/20 cursor-pointer"
    aria-label="Open Hotel Assistant Chat"
    title="Chat with Hotel Assistant"
  >
    <!-- Chat Icon when closed -->
    <svg x-show="isClosed" class="w-6 h-6 text-teal-950" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
    </svg>
    <!-- Close Icon when open -->
    <svg x-show="isOpen" class="w-6 h-6 text-teal-950" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Chatbot Panel Dialog: Reduced compact card / Mobile bottom sheet -->
  <div
    id="chatPanelDialog"
    role="dialog"
    aria-label="Hotel Assistant"
    aria-modal="true"
    x-show="isOpen"
    class="fixed inset-x-0 bottom-0 z-50 flex flex-col bg-white shadow-2xl border border-teal-900/10 overflow-hidden transition-all duration-300 rounded-t-2xl sm:rounded-2xl sm:inset-auto sm:bottom-24 sm:right-6 sm:w-[340px] max-h-[80vh] h-[470px]"
    style="display: none;"
  >
    <!-- Header: Deep Teal Palette with Robot Avatar & Name -->
    <div class="bg-gradient-to-r from-teal-950 via-teal-900 to-teal-950 text-white px-4 py-3 border-b border-teal-900/60 flex items-center justify-between flex-shrink-0 shadow-sm">
      <div class="flex items-center gap-2.5">
        <!-- Robot Assistant Avatar with Online Badge -->
        <div class="relative flex-shrink-0">
          <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-teal-900 shadow-sm border border-gold/30">
            <!-- Modern Friendly Robot Icon -->
            <svg class="w-5 h-5 text-teal-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="2" x2="12" y2="5" />
              <circle cx="12" cy="2" r="1" fill="currentColor" />
              <rect x="4" y="5" width="16" height="12" rx="3" fill="#f0fdfa" />
              <circle cx="8.5" cy="10" r="1.5" fill="currentColor" />
              <circle cx="15.5" cy="10" r="1.5" fill="currentColor" />
              <path d="M9 13.5c1 .8 2 1 3 1s2-.2 3-1" stroke-width="1.6" />
              <path d="M2 9v4" />
              <path d="M22 9v4" />
            </svg>
          </div>
        </div>

        <div>
          <h3 class="font-serif font-bold text-base text-white tracking-wide leading-tight">Cora</h3>
          <p class="text-[11px] text-slate-300 font-medium leading-none mt-0.5">Hotel Assistant</p>
        </div>
      </div>

      <button
        type="button"
        @click="closeChat"
        class="w-7 h-7 rounded-lg text-slate-300 hover:text-white hover:bg-white/10 flex items-center justify-center transition-colors cursor-pointer border-0"
        aria-label="Close Hotel Assistant Dialog"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Scrollable Message List (Rendered purely via JS textContent for strict CSP security) -->
    <div
      id="chatMessagesList"
      class="flex-1 overflow-y-auto p-3.5 space-y-2.5 bg-white"
      role="log"
      aria-live="polite"
      aria-atomic="false"
    >
      <!-- Messages, timestamps, and interactive topic pills are appended cleanly via main.js -->
    </div>

    <!-- Text Input Bar (Clean Pill Input with Refresh/Restart Icon) -->
    <div class="p-2.5 bg-white border-t border-slate-100 flex-shrink-0">
      <form @submit.prevent="sendMessage" class="flex items-center gap-1.5 bg-slate-100 border border-slate-200 rounded-full px-2 py-1 focus-within:border-teal-700 focus-within:bg-white focus-within:ring-1 focus-within:ring-teal-700/20 transition-all">
        {% csrf_token %}

        <!-- Restart / Reset conversation icon button -->
        <button
          type="button"
          @click="resetChat"
          class="w-6 h-6 rounded-full text-slate-400 hover:text-teal-900 hover:bg-slate-200/60 flex items-center justify-center transition-colors cursor-pointer border-0 flex-shrink-0"
          title="Restart conversation"
          aria-label="Restart conversation"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>

        <input
          id="chatTextInput"
          type="text"
          maxlength="300"
          placeholder="Type your message..."
          :value="inputText"
          @input="onInput"
          class="flex-1 bg-transparent border-0 px-2 py-1 text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
          autocomplete="off"
          aria-label="Ask Hotel Assistant a question"
        />

        <button
          type="submit"
          :disabled="isSendDisabled"
          class="w-7 h-7 rounded-full bg-gold hover:bg-gold-light text-teal-950 flex items-center justify-center transition-all shadow-sm focus:outline-none disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer border-0 flex-shrink-0"
          aria-label="Send message to Hotel Assistant"
        >
          <svg class="w-3.5 h-3.5 transform rotate-90 ml-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
          </svg>
        </button>
      </form>

      <!-- Minimal Sub-footer -->
      <div class="mt-1 flex justify-end px-2 text-[10px]">
        <a
          href="{{ contact_info.whatsapp_url }}"
          target="_blank"
          rel="noopener noreferrer"
          class="text-emerald-700 hover:text-emerald-800 font-medium inline-flex items-center gap-0.5"
        >
          <span>Contact</span>
          <span>&rarr;</span>
        </a>
      </div>
    </div>

  </div>

</div>
