{% load static %}
<!-- Hotel Assistant Chatbot (Homepage Only) -->
<div x-data="chatbot" @keydown.escape.window="closeChat" class="relative">

  <!-- Floating Launcher Button: Positioned above WhatsApp button -->
  <button
    id="chatLauncherBtn"
    type="button"
    @click="toggleChat"
    class="fixed bottom-24 right-6 z-50 w-14 h-14 bg-teal-950 hover:bg-teal-900 border-2 border-gold text-gold rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-all focus:outline-none focus:ring-4 focus:ring-gold/30 cursor-pointer"
    aria-label="Open Hotel Assistant Chat"
    title="Chat with Hotel Assistant"
  >
    <!-- Chat Icon when closed -->
    <svg x-show="isClosed" class="w-6 h-6 text-gold" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
    </svg>
    <!-- Close Icon when open -->
    <svg x-show="isOpen" class="w-6 h-6 text-gold" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Chatbot Panel Dialog: Desktop floating card / Mobile bottom sheet -->
  <div
    id="chatPanelDialog"
    role="dialog"
    aria-label="Hotel Assistant"
    aria-modal="true"
    x-show="isOpen"
    class="fixed inset-x-0 bottom-0 z-50 flex flex-col bg-white shadow-2xl border border-slate-200/90 overflow-hidden transition-all duration-300 rounded-t-3xl sm:rounded-2xl sm:inset-auto sm:bottom-24 sm:right-6 sm:w-[370px] max-h-[85vh] h-[540px] sm:h-[560px]"
    style="display: none;"
  >
    <!-- Header -->
    <div class="bg-gradient-to-r from-teal-950 via-teal-900 to-teal-950 text-white p-4 border-b border-teal-900/60 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gold/20 border border-gold/40 flex items-center justify-center text-gold font-serif font-bold text-base shadow-sm">
          CH
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h3 class="font-serif font-bold text-base text-white tracking-wide leading-tight">Hotel Assistant</h3>
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              Online
            </span>
          </div>
          <p class="text-[11px] text-slate-300">Hotel Coral Heights &bull; Ambalapuzha</p>
        </div>
      </div>

      <button
        type="button"
        @click="closeChat"
        class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white flex items-center justify-center transition-colors cursor-pointer border-0"
        aria-label="Close Hotel Assistant Dialog"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Scrollable Message List (Rendered purely via JS textContent for strict CSP security) -->
    <div
      id="chatMessagesList"
      class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50"
      role="log"
      aria-live="polite"
      aria-atomic="false"
    >
      <!-- Messages and actions are appended programmatically with textContent in main.js -->
    </div>

    <!-- Quick Reply Chips Container (Populated via JS) -->
    <div
      id="chatQuickChips"
      class="px-3 py-2 bg-white border-t border-slate-100 flex items-center gap-1.5 overflow-x-auto scrollbar-none flex-shrink-0"
      aria-label="Suggested topics"
    >
      <!-- Quick chips appended here -->
    </div>

    <!-- Text Input Bar -->
    <div class="p-3 bg-white border-t border-slate-200 flex-shrink-0">
      <form @submit.prevent="sendMessage" class="flex items-center gap-2">
        {% csrf_token %}
        <input
          id="chatTextInput"
          type="text"
          maxlength="300"
          placeholder="Ask about rooms, food, directions..."
          :value="inputText"
          @input="onInput"
          class="flex-1 px-3.5 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-teal-700 focus:ring-2 focus:ring-teal-700/20 transition-all"
          autocomplete="off"
          aria-label="Ask Hotel Assistant a question"
        />

        <button
          type="submit"
          :disabled="isSendDisabled"
          class="w-10 h-10 rounded-xl bg-gold hover:bg-gold-light text-teal-950 font-bold flex items-center justify-center transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-gold/50 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer border-0 flex-shrink-0"
          aria-label="Send message to Hotel Assistant"
        >
          <svg class="w-4 h-4 transform rotate-90" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
          </svg>
        </button>
      </form>

      <!-- Footer WhatsApp link -->
      <div class="mt-2 text-center">
        <a
          href="{{ contact_info.whatsapp_url }}"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-700 hover:text-emerald-800 transition-colors"
        >
          <span>Need direct staff help?</span>
          <span class="underline">Talk to us on WhatsApp &rarr;</span>
        </a>
      </div>
    </div>

  </div>

</div>
