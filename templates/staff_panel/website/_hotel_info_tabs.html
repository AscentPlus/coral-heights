<!-- Sub-Navigation Tabs for Hotel & Restaurant Details / Chatbot Knowledge Base -->
<div class="border-b border-slate-200 bg-white rounded-2xl p-2 shadow-sm">
  <div class="flex items-center gap-1 sm:gap-2 overflow-x-auto text-xs font-bold scrollbar-none">
    
    <!-- 1. Hotel Details -->
    <a href="{% url 'staff_panel:website_hotel_details' %}"
       class="px-4 py-2.5 rounded-xl whitespace-nowrap transition-all flex items-center gap-2 {% if active_tab == 'hotel' %}bg-teal-900 text-gold shadow-sm{% else %}text-slate-600 hover:text-teal-950 hover:bg-slate-100{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4m-4 0H7"/></svg>
      <span>Hotel Policies &amp; Info</span>
    </a>

    <!-- 2. Restaurant -->
    <a href="{% url 'staff_panel:website_restaurant_details' %}"
       class="px-4 py-2.5 rounded-xl whitespace-nowrap transition-all flex items-center gap-2 {% if active_tab == 'restaurant' %}bg-teal-900 text-gold shadow-sm{% else %}text-slate-600 hover:text-teal-950 hover:bg-slate-100{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>Restaurant Timings</span>
    </a>

    <!-- 3. Menu -->
    <a href="{% url 'staff_panel:website_menu' %}"
       class="px-4 py-2.5 rounded-xl whitespace-nowrap transition-all flex items-center gap-2 {% if active_tab == 'menu' %}bg-teal-900 text-gold shadow-sm{% else %}text-slate-600 hover:text-teal-950 hover:bg-slate-100{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
      <span>Dining Menu</span>
    </a>

    <!-- 4. Nearby Places -->
    <a href="{% url 'staff_panel:website_nearby_places' %}"
       class="px-4 py-2.5 rounded-xl whitespace-nowrap transition-all flex items-center gap-2 {% if active_tab == 'nearby' %}bg-teal-900 text-gold shadow-sm{% else %}text-slate-600 hover:text-teal-950 hover:bg-slate-100{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Nearby Transport &amp; Essentials</span>
    </a>

    <!-- 5. Chatbot FAQs -->
    <a href="{% url 'staff_panel:website_faqs' %}"
       class="px-4 py-2.5 rounded-xl whitespace-nowrap transition-all flex items-center gap-2 {% if active_tab == 'faqs' %}bg-teal-900 text-gold shadow-sm{% else %}text-slate-600 hover:text-teal-950 hover:bg-slate-100{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
      <span>Chatbot FAQs</span>
    </a>

    <!-- 6. Unanswered Questions -->
    <a href="{% url 'staff_panel:website_unanswered_questions' %}"
       class="px-4 py-2.5 rounded-xl whitespace-nowrap transition-all flex items-center gap-2 {% if active_tab == 'unanswered' %}bg-teal-900 text-gold shadow-sm{% else %}text-slate-600 hover:text-teal-950 hover:bg-slate-100{% endif %}">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>Unanswered Questions</span>
      {% if unhandled_count and unhandled_count > 0 %}
        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-400 text-teal-950">{{ unhandled_count }}</span>
      {% endif %}
    </a>

  </div>
</div>
