{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login — Hotel Coral Heights</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
  <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}">

  <!-- Compiled Tailwind CSS & site styles -->
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script defer src="{% static 'js/staff.js' %}"></script>
  <style>
    :root {
      --primary-teal: #042f2e;
      --gold: #c8a45e;
      --cream: #faf6f0;
    }
  </style>
</head>
<body class="bg-cream text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">
  
  <div class="w-full max-w-[380px] bg-white border border-slate-200/80 rounded-2xl p-6 sm:p-7 shadow-xl">
    
    <!-- Header / Brand (Matching Hotel Website Light Theme) -->
    <div class="text-center mb-6">
      <div class="mb-3 flex justify-center">
        <img src="{% static 'images/logo.png' %}" alt="Hotel Coral Heights Logo" class="h-16 w-auto object-contain" />
      </div>
      <h1 class="font-serif text-xl font-bold text-teal-950 tracking-tight">Staff Operations Portal</h1>
      <p class="text-slate-500 text-xs mt-0.5">Hotel Coral Heights · Ambalapuzha</p>
    </div>

    <!-- Error Alert -->
    {% if error_message %}
      <div class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-lg text-rose-700 text-xs flex items-center gap-2.5">
        <svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="font-medium">{{ error_message }}</span>
      </div>
    {% endif %}

    <!-- Login Form (Compact Height & Clean Inputs) -->
    <form method="POST" action="" class="space-y-4" novalidate>
      {% csrf_token %}

      <div>
        <label for="id_username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
        <input
          type="text"
          name="username"
          id="id_username"
          required
          autofocus
          placeholder="Enter username"
          class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-700/20 focus:bg-white transition-all placeholder:text-slate-400"
        />
      </div>

      <div>
        <label for="id_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <input
          type="password"
          name="password"
          id="id_password"
          required
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 bg-slate-50/50 border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-700/20 focus:bg-white transition-all placeholder:text-slate-400"
        />
      </div>

      <div class="pt-1">
        <button
          type="submit"
          class="w-full py-3 bg-gold text-teal-950 font-bold rounded-xl text-sm tracking-wide hover:bg-gold-light transition-all focus:outline-none focus:ring-4 focus:ring-gold/30 shadow-md flex items-center justify-center gap-2"
        >
          <span>Sign In to Staff Portal</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>
    </form>
    
  </div>
</body>
</html>
